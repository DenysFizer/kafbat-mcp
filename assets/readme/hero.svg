<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">kafbat-mcp</title>
  <desc id="desc">kafbat-mcp, an MCP server for kafbat UI: work with Kafka from your AI client, signed in with your own kafbat login, read-only by default. Beside the title, an example answer: describe_topic on orders.v1 shows three partitions read up to different offsets and the consumer group billing, STABLE, with a lag of 7.</desc>

  <rect width="1200" height="420" rx="24" fill="#15130F"/>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#9A9384">MCP SERVER · KAFBAT UI</text>
    <text x="-3" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="700" fill="#F5F1E8">kafbat-mcp</text>
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#DDD6C8">Work with Kafka from your AI client,</text>
    <text x="0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#DDD6C8">signed in with your own kafbat login.</text>
    <text x="0" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9A9384">read-only by default · SSO or login form</text>
  </g>

  <!-- the logo's partitions as a real answer: a question, the tool that answers it, and what it returns
       (orders.v1 and billing are the test suite's example topic and group) -->
  <g id="topic-answer">
    <rect x="632" y="48" width="512" height="324" rx="18" fill="#1C1915" stroke="#2B2620"/>

    <path d="M658 84 L668 92 L658 100" fill="none" stroke="#0EA5E9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="680" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" fill="#F5F1E8">Who reads orders.v1, and how far behind?</text>

    <text x="656" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9A9384"><tspan fill="#0EA5E9">describe_topic</tspan> orders.v1 · 3 partitions</text>
    <line x1="656" y1="158" x2="1120" y2="158" stroke="#2B2620"/>

    <g id="partitions" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#9A9384">
      <text x="656" y="198">p0</text>
      <rect x="700" y="182" width="340" height="20" rx="10" fill="#F59E0B"/>
      <rect x="1048" y="182" width="40" height="20" rx="10" fill="#F59E0B" fill-opacity="0.26"/>

      <text x="656" y="240">p1</text>
      <rect x="700" y="224" width="250" height="20" rx="10" fill="#FBBF24"/>
      <rect x="958" y="224" width="72" height="20" rx="10" fill="#FBBF24" fill-opacity="0.26"/>

      <text x="656" y="282">p2</text>
      <rect x="700" y="266" width="388" height="20" rx="10" fill="#D97706"/>
    </g>

    <line x1="656" y1="308" x2="1120" y2="308" stroke="#2B2620"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
      <text x="656" y="344" fill="#9A9384">group <tspan fill="#F5F1E8">billing</tspan> · STABLE</text>
      <text x="1120" y="344" text-anchor="end" fill="#FBBF24">lag 7</text>
    </g>
  </g>
</svg>
