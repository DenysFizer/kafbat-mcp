name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catches kafbat `main` and yt-dlp drift with no change on our side
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a commit SHA, not a tag: a tag can be moved to different code, a SHA cannot. The comment
# carries the version so Dependabot can bump both together.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest

  build:
    # The package that `uv build` produces must install and start, and its README must render on PyPI,
    # so a release never fails at the last step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Wheel installs and starts
        run: |
          out="$(uv run --isolated --no-project --with dist/*.whl kafbat-mcp </dev/null 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "KAFBAT_URL must be set"

  integration:
    # Real kafbat, Kafka, Schema Registry and Connect in Docker. One job per kafbat release, so they run in
    # parallel on separate runners instead of contending for one machine.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kafbat: [v1.3.0, v1.4.2, v1.5.0, main]
    # Upstream `main` can break with no change on our side: report it, don't block pull requests on it.
    continue-on-error: ${{ matrix.kafbat == 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest tests/test_integration.py
        env:
          KAFBAT_INTEGRATION: "1"
          KAFBAT_IMAGES: ghcr.io/kafbat/kafka-ui:${{ matrix.kafbat }}
